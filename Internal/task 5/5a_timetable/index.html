<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Class Time Table</h2>
        <table class="table table-bordered table-stripped text-center">
            <thead class="table-dark">
                <tr>
                    <th>Day</th>
                    <th>Hr 1</th>
                    <th>Hr 2</th>
                    <th>Hr 3</th>
                    <th>Hr 4</th>
                    <th>Hr 5</th>
                    <th>Hr 6</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>CN</td>
                    <td>WT</td>
                    <td>ADA</td>
                    <td>DS</td>
                    <td>PE</td>
                    <td>Lib</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
