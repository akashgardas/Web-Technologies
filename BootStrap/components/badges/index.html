<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootStrap Components - Badges</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    />
</head>
<body>
    <div class="container">
        <h1 class="text-center">Badges</h1>

        <h1>This is a heading <span class="badge text-bg-primary">New</span></h1>
        <p>Resizes according to its parent element</p>

        <h3>Used to Button</h3>
        <button type="button" class="btn btn-primary">
            Notifications <span class="badge text-bg-secondary">3</span>
        </button>

        <button type="button" class="btn btn-primary position-relative">
            Inbox
            <span class="position-absolute top-0 start-100 badge translate-middle bg-danger rounded-pill">
                99+
                <span class="visually-hidden">unread messages</span>
            </span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
