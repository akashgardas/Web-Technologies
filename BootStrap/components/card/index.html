<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BootStrap Components - Card</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <h1 class="text-center">Cards</h1>

    <div class="container">
      <div class="row mb-3">
        <div class="col">
          <div class="card" style="width: 18rem">
            <img
              src="images/200p200p.png"
              alt="Card image"
              class="card-img-top"
            />
            <div class="card-body">
              <h5 class="card-title">Card Title</h5>
              <h6 class="card-subtitle mb-2 text-body-secondary">
                Card subtitle
              </h6>
              <p class="card-text">Some quick description of the card</p>
              <a href="#" class="btn btn-primary">Go Somewhere</a>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card">
            <div class="card-header">Header</div>

            <ul class="list-group list-group-flush">
              <li class="list-group-item">list-group</li>
              <li class="list-group-item">list-group-flush</li>
              <li class="list-group-item">list-group-item</li>
            </ul>

            <div class="card-footer">
              <button type="button" class="btn btn-primary">
                Go Somewhere
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <h2>Navigation</h2>
        <div class="col"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
