<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Componenets - Carousel</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
</head>
<body>
    <h1 class="text-center">Carousel</h1>

    <div id="carouselExample" class="carousel carousel-fade" data-bs-ride="true">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3"></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="3000">
                <img src="./images/waterfalls.png" class="d-block w-100" alt="Waterfalls">
                
                <div class="carousel-caption text-md-start text-lg-center">
                    <h5>Waterfalls</h5>
                    <p>Slide 1</p>
                    <button type="button" class="btn btn-primary">Learn More</button>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="3000">
                <img src="./images/night-stars.png" class="d-block w-100" alt="Stars">

                <div class="carousel-caption text-md-start text-lg-center">
                    <h5>Night Stars</h5>
                    <p>Slide 2</p>
                    <button type="button" class="btn btn-primary">Learn More</button>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="3000">
                <img src="./images/islands.png" alt="islands" class="d-block w-100">

                <div class="carousel-caption text-md-start text-lg-center">
                    <h5>Islands</h5>
                    <p>Slide 3</p>
                    <button type="button" class="btn btn-primary">Learn More</button>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="3000">
                <img src="./images/moon.png" alt="Moon" class="d-block w-100">

                <div class="carousel-caption text-md-start text-lg-center">
                    <h5>Moon</h5>
                    <p>Slide 4</p>
                    <button type="button" class="btn btn-primary">Learn More</button>
                </div>
            </div>
        </div>

        <button type="button" class="carousel-control-prev" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button type="button" class="carousel-control-next" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
