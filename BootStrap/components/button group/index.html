<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootStrap Components - Button Group</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    />
</head>
<body>
    <h1 class="text-center">Button Group</h1>

    <div class="container">
       
        <div class="row my-2">
                <div class="col">
                    <div class="btn-group" role="group" aria-label="Button Group Example">
                    <button type="button" class="btn btn-primary">Left</button>
                    <button type="button" class="btn btn-secondary">Middle</button>
                    <button type="button" class="btn btn-warning">Right</button>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-outline-danger">Left</button>
                    <button type="button" class="btn btn-outline-success active">Middle</button>
                    <button type="button" class="btn btn-outline-primary">Right</button>
                </div>
            </div>
        </div>
        
        <div class="row my-2">
            <h2>CheckBox and Radio Button</h2>
            <div class="col">
                <div class="btn-group">
                    <input type="checkbox" name="checkbox1" id="checkBox1" class="btn-check">
                    <label for="checkBox1" class="btn btn-outline-primary">CheckBox 1</label>

                    <input type="checkbox" name="checkbox2" id="checkBox2" class="btn-check">
                    <label for="checkBox2" class="btn btn-outline-primary">CheckBox 2</label>

                    <input type="checkbox" name="checkbox3" id="checkBox3" class="btn-check">
                    <label for="checkBox3" class="btn btn-outline-primary">CheckBox 3</label>
                </div>
            </div>
            <div class="col">
                <div class="btn-group">
                    <input type="radio" name="radio" id="btncheck1" class="btn-check">
                    <label for="btncheck1" class="btn btn-outline-primary">Radio 1</label>

                    <input type="radio" name="radio" id="btncheck2" class="btn-check">
                    <label for="btncheck2" class="btn btn-outline-primary">Radio 2</label>

                    <input type="radio" name="radio" id="btncheck3" class="btn-check">
                    <label for="btncheck3" class="btn btn-outline-primary">Radio 3</label>
                </div>
            </div>
        </div>

        <div class="row my-2">
            <h2>ToolBar</h2>
            <div class="col">
                <div class="btn-toolbar">
                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-primary">1</button>
                        <button type="button" class="btn btn-primary">2</button>
                        <button type="button" class="btn btn-primary">3</button>
                        <button type="button" class="btn btn-primary">4</button>
                    </div>

                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-secondary">5</button>
                        <button type="button" class="btn btn-secondary">6</button>
                        <button type="button" class="btn btn-secondary">7</button>
                    </div>

                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-success">8</button>
                    </div>
                </div>
            </div>

        </div>

        <div class="row my-2">
            <div class="col">
                <div class="btn-toolbar">
                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-outline-primary">1</button>
                        <button type="button" class="btn btn-outline-primary">2</button>
                        <button type="button" class="btn btn-outline-primary">3</button>
                    </div>

                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="text" name="username" id="userName" class="form-control" placeholder="Toolbar example">
                    </div>
                </div>
            </div>
        </div>

        <div class="row my-2">
            <h2>Nesting Button Groups</h2>

            <div class="col">
                <div class="btn-group">
                    <button type="button" class="btn btn-primary">1</button>
                    <button type="button" class="btn btn-primary">2</button>
                    
                    <div class="btn-group">
                        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Dropdown</button>

                        <ul class="dropdown-menu">
                            <li class="dropdown-item">dropdown-toggle</li>
                            <li class="dropdown-item">dropdown-menu</li>
                            <li class="dropdown-item">dropdown-item</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="row my-2">
            <h2>Vertical variation</h2>
            <div class="col">
                <div class="btn-group-vertical">
                    <div class="btn-group">
                        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Dropdown</button>

                        <ul class="dropdown-menu">
                            <li class="dropdown-item">btn-group-vertical</li>
                            <li class="dropdown-item">dropdown</li>
                        </ul>
                    </div>

                    <button type="button" class="btn btn-primary">Button</button>

                    <div class="btn-group dropstart">
                        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Dropdown</button>

                        <ul class="dropdown-menu">
                            <li class="dropdown-item">dropstart</li>
                            <li class="dropdown-item">dropend</li>
                            <li class="dropdown-item">dropup</li>
                        </ul>
                    </div>
                    
                    <div class="btn-group dropend">
                        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Dropdown</button>

                        <ul class="dropdown-menu">
                            <li class="dropdown-item">dropstart</li>
                            <li class="dropdown-item">dropend</li>
                            <li class="dropdown-item">dropup</li>
                        </ul>
                    </div>

                    <div class="btn-group dropup">
                        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Dropdown</button>

                        <ul class="dropdown-menu">
                            <li class="dropdown-item">dropstart</li>
                            <li class="dropdown-item">dropend</li>
                            <li class="dropdown-item">dropup</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
