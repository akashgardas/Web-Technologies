<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid BootStrap</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
    <div class="container bg-primary text-white border">
        <div class="row m-1">
            <div class="col-md-2 bg-dark">1</div>
            <div class="col-md-2 bg-dark">2</div>
            <div class="col-md-2 bg-dark">3</div>
            <div class="col-md-2 bg-dark">4</div>
            <div class="col-md-2 bg-dark">5</div>
            <div class="col-md-2 bg-dark">6</div>
        </div>
        <div class="row m-1">
            <div class="col-md-3 bg-dark">1</div>
            <div class="col-md-3 bg-dark">2</div>
            <div class="col-md-3 bg-dark">3</div>
            <div class="col-md-3 bg-dark">4</div>
        </div>
        <div class="row m-1">
            <div class="col-md-4 bg-dark">1</div>
            <div class="col-md-4 bg-dark">2</div>
            <div class="col-md-4 bg-dark">3</div>
        </div>
        <div class="row m-1">
            <div class="col-md-6 bg-dark">1</div>
            <div class="col-md-6 bg-dark">2</div>
        </div>
        <div class="row m-1">
            <div class="col-md-12 bg-dark">1</div>
        </div>
    </div>
</body>
</html>
