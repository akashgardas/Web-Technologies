<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings - BootStrap</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
    <h1>List Styling</h1>
    <div class="container">
        <ul class="list-inline">
            <li class="list-inline-item">Home</li>
            <li class="list-inline-item">Products</li>
            <li class="list-inline-item">About us</li>
            <li class="list-inline-item">Contact</li>
        </ul>

        <ol class="list-inline">
            <li class="list-inline-item">Home</li>
            <li class="list-inline-item">Products</li>
            <li class="list-inline-item">About us</li>
            <li class="list-inline-item">Contact</li>
        </ol>
    </div>

    <h2>Tables</h2>
    <table class="table table-borderless table-hover table-striped table-dark">
        <tr class="table-success">
            <th>Roll No</th>
            <th>Name</th>
            <th>Branch</th>
        </tr>
        <tr>
            <td>420</td>
            <td>Aniket</td>
            <td>Central Jail</td>
        </tr>
        <tr>
            <td>421</td>
            <td>Aditya</td>
            <td>Chanchalguda Jail</td>
        </tr>
        <tr>
            <td>422</td>
            <td>Abhishek</td>
            <td>Andaman & Nicobar Jail</td>
        </tr>
    </table>
</body>
</html>
