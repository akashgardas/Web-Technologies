<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-4 form m-auto">
                <h2 class="text-center">Login</h2>
                <label for="userName" class="form-label">Username</label>
                <input type="text" class="form-control" id="userName" required>

                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>

                <label for="mobileNumber" class="form-label">Mobile</label>
                <input type="number" class="form-control" id="mobileNumber" required>

                
                <button type="submit" class="btn btn-primary mt-2" id="btn">Login</button>
            </div>
        </div>
        
    </div>
    
    <script src="script.js"></script>
</body>
</html>
