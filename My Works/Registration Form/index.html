<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <form>
            <div>
                    <label for="full-name" class="form-label">FullName</label>
                    <input type="text" name="full-name" id="full-name" class="form-control">
            </div>
            
            <div>
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control">
            </div>
                
            <div>

                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control">
            </div>
             <p>Gender</p>
            <div class="form-check">
               
                <input type="radio" name="gender" id="male" class="form-check-input">
                <label for="male" class="form-label" class="form-check-label">Male</label>
            </div>
            
            <div class="form-check">
                <input type="radio" name="gender" id="female" class="form-check-input">
                <label for="female" class="form-check-label">Female</label>
            </div>
            <p>Skills</p>
            <div class="form-check">           
                <input type="checkbox" name="skill" id="python" class="form-check-input">
                <label for="python" class="form-check-label">Python</label>
            </div>
            <div class="form-check">
                <input type="checkbox" name="skill" id="java" class="form-check-input">
                <label for="java" class="form-check-label">Java</label>
            </div>
            
            
            <div>
                <label for="profile" class="form-label">Profile</label>
                <div class="input-group">
                    <input type="file" name="profile" class="form-control" id="profile">
                </div>
            </div>
            
            <div>

                <label for="dob" class="form-label">DOB</label>
                <input type="date" name="dob" id="dob" class="form-control">
            </div>
            
            <div>
                <label for="country" class="form-label">Label</label>
                <select name="country" id="country" class="form-select">
                    <option value="india">India</option>
                    <option value="us">US</option>
                </select>
            </div>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
